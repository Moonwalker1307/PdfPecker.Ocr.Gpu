name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The PdfPecker.Ocr the projects build against until a release with OcrAccelerator is on nuget.org.
  PDFPECKER_OCR_REF: main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to the same commits as PdfPecker.Ocr's workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: PdfPecker.Ocr.Gpu

      # Next to this repository, where Directory.Build.props looks for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Moonwalker1307/PdfPecker.Ocr
          ref: ${{ env.PDFPECKER_OCR_REF }}
          persist-credentials: false
          path: PdfPecker.Ocr

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        working-directory: PdfPecker.Ocr.Gpu
        run: dotnet build -c Release

      # GitHub's runners have no GPU: the tests run the ONNX path on ONNX Runtime's CPU provider and check the fallback.
      - name: Test
        working-directory: PdfPecker.Ocr.Gpu
        run: dotnet test -c Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        working-directory: PdfPecker.Ocr.Gpu
        run: dotnet pack src/PdfPecker.Ocr.Gpu -c Release -o nupkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: PdfPecker.Ocr.Gpu/nupkg
